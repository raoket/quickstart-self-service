# --- emailservice ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emailservice
  namespace: hipstershop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
  namespace: hipstershop
spec:
  selector:
    matchLabels: {app: emailservice}
  template:
    metadata:
      labels: {app: emailservice}
    spec:
      serviceAccountName: emailservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: server
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/emailservice:v0.10.3
          ports: [{containerPort: 8080}]
          env:
            - {name: PORT, value: "8080"}
            - {name: DISABLE_PROFILER, value: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe: {grpc: {port: 8080}, periodSeconds: 5}
          livenessProbe: {grpc: {port: 8080}, periodSeconds: 5}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
  namespace: hipstershop
  labels: {app: emailservice}
