# --- frontend ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: hipstershop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hipstershop
spec:
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      serviceAccountName: frontend
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: server
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/frontend:v0.10.3
          ports: [{containerPort: 8080}]
          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
                - {name: "Cookie", value: "shop_session-id=x-readiness-probe"}
          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
                - {name: "Cookie", value: "shop_session-id=x-liveness-probe"}
          env:
            - {name: PORT, value: "8080"}
            - {name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550"}
            - {name: CURRENCY_SERVICE_ADDR, value: "currencyservice:7000"}
            - {name: CART_SERVICE_ADDR, value: "cartservice:7070"}
            - {name: RECOMMENDATION_SERVICE_ADDR, value: "recommendationservice:8080"}
            - {name: SHIPPING_SERVICE_ADDR, value: "shippingservice:50051"}
            - {name: CHECKOUT_SERVICE_ADDR, value: "checkoutservice:5050"}
            - {name: AD_SERVICE_ADDR, value: "adservice:9555"}
            - name: SHOPPING_ASSISTANT_SERVICE_ADDR
              value: shoppingassistantservice:80
            - name: ENABLE_ASSISTANT
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hipstershop
  labels: {app: frontend}
spec:
  type: ClusterIP
  selector: {app: frontend}
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# EKS-friendly external LB for the frontend
apiVersion: v1
kind: Service
metadata:
  name: frontend-external
  namespace: hipstershop
  labels: {app: frontend}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-target-node-labels: kubernetes.io/os=linux
